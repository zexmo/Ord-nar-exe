<!-- LIVE NODE GRAPH -->

<canvas id="nodeGraph"></canvas>

<div id="centerOverlay">

<div class="overlayBox">

<div class="overlayTitle">
NETWORK FLOW
</div>

<div class="overlayValue">
2.4TB/s
</div>

</div>

<div class="overlayBox">

<div class="overlayTitle">
ACTIVE NODES
</div>

<div class="overlayValue">
248
</div>

</div>

</div>

<style>

#nodeGraph{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

z-index:-1;

opacity:0.45;

}

#centerOverlay{

position:absolute;

top:110px;
left:50%;

transform:translateX(-50%);

display:flex;

gap:20px;

z-index:100;

}

.overlayBox{

width:190px;

padding:16px;

border:1px solid rgba(0,255,100,0.4);

background:rgba(0,255,100,0.05);

backdrop-filter:blur(5px);

box-shadow:0 0 20px rgba(0,255,100,0.1);

text-align:center;

}

.overlayTitle{

font-size:13px;

opacity:0.7;

margin-bottom:10px;

}

.overlayValue{

font-size:30px;

color:#00ff88;

text-shadow:0 0 12px #00ff88;

}

</style>

<script>

const graph=document.getElementById("nodeGraph");

const gctx=graph.getContext("2d");

graph.width=window.innerWidth;

graph.height=window.innerHeight;

const points=[];

for(let i=0;i<55;i++){

points.push({

x:Math.random()*graph.width,

y:Math.random()*graph.height,

vx:(Math.random()-0.5)*0.6,

vy:(Math.random()-0.5)*0.6

});

}

function animateGraph(){

gctx.clearRect(0,0,graph.width,graph.height);

for(let i=0;i<points.length;i++){

const a=points[i];

a.x+=a.vx;

a.y+=a.vy;

if(a.x<0||a.x>graph.width){
a.vx*=-1;
}

if(a.y<0||a.y>graph.height){
a.vy*=-1;
}

gctx.beginPath();

gctx.arc(a.x,a.y,2,0,Math.PI*2);

gctx.fillStyle="#00ff88";

gctx.fill();

for(let j=i+1;j<points.length;j++){

const b=points[j];

const dist=Math.hypot(
a.x-b.x,
a.y-b.y
);

if(dist<130){

gctx.strokeStyle=
"rgba(0,255,100,"+
(1-dist/130)*0.2+
")";

gctx.beginPath();

gctx.moveTo(a.x,a.y);

gctx.lineTo(b.x,b.y);

gctx.stroke();

}

}

}

requestAnimationFrame(animateGraph);

}

animateGraph();

</script>
