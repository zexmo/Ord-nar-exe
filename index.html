<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ORD-NAR-EXE // SİBER OPERASYON MERKEZİ v6.0</title>
    <style>
        :root { --neon: #00ff66; --bg: #020202; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; margin: 0; }
        #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 5px solid var(--neon); }
        .grid { display: grid; grid-template-columns: repeat(3, 150px); gap: 20px; }
        button { background: none; border: 1px solid var(--neon); color: var(--neon); padding: 15px; cursor: pointer; font-weight: bold; }
        
        /* SATÜRN TASARIMI */
        .system-container { display: flex; justify-content: center; align-items: center; height: 400px; perspective: 1000px; }
        .planet { width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #444, #000); border-radius: 50%; box-shadow: 0 0 50px var(--neon); }
        .ring { position: absolute; border: 4px solid var(--neon); border-radius: 50%; transform: rotateX(75deg); animation: spin 5s linear infinite; }
        .r1 { width: 200px; height: 200px; } .r2 { width: 250px; height: 250px; animation-duration: 8s; }
        @keyframes spin { 100% { transform: rotateX(75deg) rotateZ(360deg); } }

        /* PANELLER */
        .ui-panel { border: 1px solid var(--neon); padding: 15px; margin: 10px; background: rgba(0,20,5,0.8); }
        .data-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- DİL SEÇİMİ -->
    <div id="overlay">
        <h1>SİSTEM ERİŞİMİ: ORD-NAR-EXE</h1>
        <div class="grid">
            <button onclick="boot('TR')">TÜRKÇE</button>
            <button onclick="boot('EN')">ENGLISH</button>
            <button onclick="boot('CN')">中文</button>
            <button onclick="boot('FR')">FRANÇAIS</button>
            <button onclick="boot('DE')">DEUTSCH</button>
            <button onclick="boot('RU')">РУССКИЙ</button>
        </div>
    </div>

    <!-- SES -->
    <iframe id="yt-player" width="0" height="0" src="https://www.youtube.com/embed/7qmC1OJxNqw?autoplay=1&loop=1&playlist=7qmC1OJxNqw" frameborder="0"></iframe>

    <main style="display:grid; grid-template-columns: 300px 1fr 300px; height: 100vh;">
        <section class="ui-panel">
            <div id="clock">SAAT: 00:00:00</div>
            <div id="date">TARİH: 22.05.2026</div>
            <div class="data-row"><span>IP ADRESİ:</span><span id="ip">185.228.168.95</span></div>
            <div class="data-row"><span>KONUM:</span><span id="loc">ISTANBUL, TR</span></div>
            <canvas id="map" width="250" height="200" style="background:#000; margin-top:20px;"></canvas>
        </section>

        <section class="system-container">
            <div class="planet"></div>
            <div class="ring r1"></div>
            <div class="ring r2"></div>
        </section>

        <section class="ui-panel">
            <div id="console" style="height:400px; overflow:hidden; font-size:12px;"></div>
            <input type="text" id="cmd" placeholder="ROOT@ORDINAR:~#" style="width:100%; background:none; border:1px solid var(--neon); color:white;">
        </section>
    </main>

    <script>
        function boot(lang) {
            document.getElementById('overlay').style.display = 'none';
            log("SİSTEM BAŞLATILIYOR... DİL: " + lang);
            setInterval(updateTime, 1000);
            drawMap();
        }

        function log(msg) {
            const consoleBox = document.getElementById('console');
            consoleBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        }

        function updateTime() {
            document.getElementById('clock').innerText = "SAAT: " + new Date().toLocaleTimeString();
        }

        function drawMap() {
            const c = document.getElementById('map').getContext('2d');
            c.strokeStyle = '#00ff66';
            c.strokeRect(10, 10, 230, 180);
            c.beginPath(); c.arc(125, 100, 20, 0, Math.PI*2); c.stroke();
        }

        // Terminal komutları (Daha fazla ekleyerek satır sayısını artırabilirsin)
        document.getElementById('cmd').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                log("KOMUT YÜRÜTÜLDÜ: " + this.value);
                this.value = '';
            }
        });
    </script>
</body>
</html>
