<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Hardware Stress Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #010409;
            color: #f0f6fc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- KONTROL ARAYÜZÜ --- */
        .control-panel {
            width: 90%;
            max-width: 550px;
            background: #0d1117;
            border: 2px solid #ff3366;
            border-radius: 4px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.2);
            text-align: center;
            z-index: 10;
        }

        .panel-header {
            color: #ff3366;
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .panel-desc {
            color: #8b949e;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
            background: #161b22;
            padding: 15px;
            border-left: 4px solid #ff3366;
        }

        .start-btn {
            background: transparent;
            color: #ff3366;
            border: 2px solid #ff3366;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background: #ff3366;
            color: #010409;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        /* --- SENSÖR STRES KATMANI --- */
        #stress-environment {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        /* Yüksek Hızlı Kromatik Strobe Efekti */
        .strobe-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            animation: hardwareStrobe 0.02s infinite steps(1);
        }

        /* İleri Geri ve Titreşim Hareketi Yapan Robotik Hedef */
        .optical-target {
            width: 80vw;
            height: 80vw;
            max-width: 600px;
            max-height: 600px;
            z-index: 5;
            animation: targetAnimate 0.05s infinite linear;
        }

        /* --- HARDWARE TEST ANIMASYONLARI --- */
        @keyframes hardwareStrobe {
            0% { background-color: #ffffff; }    /* Beyaz Doygunluk */
            33% { background-color: #00ff00; }   /* Yeşil Doygunluk */
            66% { background-color: #ff0000; }   /* Kırmızı Doygunluk */
            100% { background-color: #000000; }  /* Siyah Modu */
        }

        @keyframes targetAnimate {
            0% { transform: translate(15px, -10px) scale(1.3); }
            25% { transform: translate(-20px, 15px) scale(0.8); }
            50% { transform: translate(10px, 20px) scale(1.4); }
            75% { transform: translate(-15px, -15px) scale(0.9); }
            100% { transform: translate(5px, -5px) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- Kontrol Paneli -->
    <div class="control-panel" id="panelBox">
        <div class="panel-header">[ DUAL-SIGNAL STRES MODULE ]</div>
        <div class="panel-desc">
            <strong>PARAMETRELER:</strong> Frekans modülasyonlu (FM) glitch sinyali aktiftir. Optik sensör kararlılığı için yüksek kontrastlı ve keskin geometrik desenlere sahip robotik şablon kullanılacaktır.
        </div>
        <button class="start-btn" onclick="executeAdvancedStressTest()">TESTI BAŞLAT</button>
    </div>

    <!-- Stres Ortamı -->
    <div id="stress-environment">
        <div class="strobe-overlay"></div>
        
        <!-- Büyük Mercekli ve Keskin Geometrili Robotik Matris -->
        <svg class="optical-target" viewBox="0 0 200 200" xmlns="http://w3.org">
            <!-- Dış Koruyucu Kalkan -->
            <polygon points="100,10 190,50 160,190 40,190 10,50" fill="#111111" stroke="#ffffff" stroke-width="5"/>
            
            <!-- Büyük Robotik Mercek Gözler -->
            <circle cx="65" cy="80" r="30" fill="#000000" stroke="#ffffff" stroke-width="4"/>
            <circle cx="135" cy="80" r="30" fill="#000000" stroke="#ffffff" stroke-width="4"/>
            
            <!-- Genişletilmiş Büyük Göz Bebekleri (Maksimum Kontrast) -->
            <circle cx="65" cy="80" r="18" fill="#ffffff"/>
            <circle cx="135" cy="80" r="18" fill="#ffffff"/>
            <circle cx="65" cy="80" r="8" fill="#000000"/>
            <circle cx="135" cy="80" r="8" fill="#000000"/>
            
            <!-- Keskin/Sivri Diş Yapısı Mekanizması -->
            <polygon points="40,140 50,165 60,140 70,165 80,140 90,165 100,140 110,165 120,140 130,165 140,140 150,165 160,140" fill="none" stroke="#ffffff" stroke-width="5"/>
            <polygon points="45,175 55,155 65,175 75,155 85,175 95,155 105,175 115,155 125,175 135,155 145,175 155,155" fill="none" stroke="#ffffff" stroke-width="5"/>

            <!-- Yatay Parazit Çizgileri -->
            <line x1="0" y1="30" x2="200" y2="30" stroke="#00ff00" stroke-width="3">
                <animate attributeName="y1" values="30;170;30" dur="0.05s" repeatCount="indefinite"/>
                <animate attributeName="y2" values="30;170;30" dur="0.05s" repeatCount="indefinite"/>
            </line>
        </svg>
    </div>

    <script>
        let audioCtx = null;

        function runAdvancedGlitchSignal() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const durationInSeconds = 20;
            const bufferSize = audioCtx.sampleRate * durationInSeconds;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            // Çoklu Matematiksel Fonksiyonlarla Geliştirilmiş Glitch Yapısı
            for (let i = 0; i < bufferSize; i++) {
                // Temel sinyal ve beyaz gürültü birleşimi
                let baseSignal = Math.sin(i * 0.5) + (Math.random() * 2 - 1);
                
                // Frekans Kırılmaları (Glitch Etkisi): Belirli aralıklarla sinyali tersine çevirir veya çarpar
                if (i % 300 < 80) {
                    baseSignal = Math.tan(i * 0.1) * 2; 
                }
                if (i % 1000 < 150) {
                    baseSignal = baseSignal * Math.sin(i * 0.01); // Genlik modülasyonu paraziti
                }

                // Dijital Sınırda Sert Kırpma (Hard Clipping)
                if (baseSignal > 0) {
                    data[i] = 1.0; 
                } else {
                    data[i] = -1.0;
                }
            }

            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            // Farklı frekans tepkilerini test etmek için çift filtre zinciri
            const lowFilter = audioCtx.createBiquadFilter();
            lowFilter.type = "peaking";
            lowFilter.frequency.setValueAtTime(1500, audioCtx.currentTime);
            lowFilter.Q.setValueAtTime(25, audioCtx.currentTime);
            lowFilter.gain.setValueAtTime(15, audioCtx.currentTime);

            const highFilter = audioCtx.createBiquadFilter();
            highFilter.type = "peaking";
            highFilter.frequency.setValueAtTime(4000, audioCtx.currentTime); // Yüksek frekans testi (4 kHz)
            highFilter.Q.setValueAtTime(20, audioCtx.currentTime);
            highFilter.gain.setValueAtTime(15, audioCtx.currentTime);

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime);

            // Bağlantı Yapısı
            noiseNode.connect(lowFilter);
            lowFilter.connect(highFilter);
            highFilter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            noiseNode.start();
        }

        function executeAdvancedStressTest() {
            const panel = document.getElementById('panelBox');
            const environment = document.getElementById('stress-environment');
            
            if(panel) panel.style.display = 'none';
            if(environment) environment.style.display = 'flex';

            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // Geliştirilmiş glitch sinyalini başlat
            runAdvancedGlitchSignal();
        }
    </script>
</body>
</html>
