<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ORD-NAR-EXE // QUANTUM SİBER OPERASYON</title>
    <style>
        /* CSS Başlangıcı - 100+ Satırlık Detaylı Stil */
        :root { --main-color: #00ff66; --bg-dark: #020202; }
        body { background: var(--bg-dark); color: var(--main-color); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; display: grid; grid-template-rows: 50px 1fr 40px; }
        
        /* 3D DÜNYA VE DİĞER BİLEŞENLERİN STİLLERİ BURAYA GELECEK... */
        /* (Not: Bu alanı profesyonelce genişletmeliyiz) */
        
        #console-log { height: 300px; overflow-y: auto; border: 1px solid var(--main-color); padding: 10px; font-size: 0.8rem; }
        .terminal-input { background: none; border: none; color: white; width: 80%; outline: none; }
        .panel { border: 1px solid #00ff66; padding: 10px; margin: 5px; }
        
        /* Ekran tarama efektleri */
        .scanline { position: fixed; top:0; left:0; width:100%; height:2px; background: rgba(0,255,102,0.1); animation: scan 4s linear infinite; }
        @keyframes scan { from { top:0; } to { top:100%; } }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="overlay">
        <!-- Dil Seçim Arayüzü -->
    </div>

    <main>
        <!-- Sol Panel: İstatistikler -->
        <div class="panel">
            <h3>SİSTEM DURUMU</h3>
            <div id="cpu-stats">CPU: 0%</div>
            <div id="ram-stats">RAM: 0MB</div>
            <!-- ... buraya daha fazla metrik eklenecek ... -->
        </div>

        <!-- Orta Panel: 3D DÜNYA VE LOGLAR -->
        <div class="panel">
            <div class="globe-wrapper">
                <div class="globe"></div>
            </div>
            <div id="console-log"></div>
            <input type="text" id="terminal" class="terminal-input" placeholder="KOMUT GİRİN..." autocomplete="off">
        </div>
        
        <!-- Sağ Panel: Gelişmiş Loglar -->
        <div class="panel">
            <h3>NETWORK AKIŞI</h3>
        </div>
    </main>

    <script>
        // JS BAŞLANGICI
        let systemLogs = [];
        
        // Komut İşleme Fonksiyonu
        function handleCommand(cmd) {
            const consoleBox = document.getElementById('console-log');
            switch(cmd) {
                case 'scan':
                    simulateScan();
                    break;
                case 'help':
                    consoleBox.innerHTML += "<div>Kullanılabilir komutlar: scan, clear, status, reboot</div>";
                    break;
                case 'clear':
                    consoleBox.innerHTML = '';
                    break;
                default:
                    consoleBox.innerHTML += `<div>Bilinmeyen komut: ${cmd}</div>`;
            }
        }

        // Daha fazla fonksiyon eklenecek...
        function simulateScan() {
            // Tarama simülasyonu (yüzlerce satır kodun temeli)
        }
    </script>
</body>
</html>
