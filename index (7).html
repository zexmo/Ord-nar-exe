<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XqrStore - Sistem Geri Yükleme</title>
    <style>
        /* --- BAŞLANGIÇ EKRANI --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #030712;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .terminal-box {
            width: 90%;
            max-width: 600px;
            background: #090d16;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        .terminal-header {
            color: #ef4444;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .terminal-text {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
        }

        .action-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #dc2626;
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.6);
        }

        /* --- JUMPSCARE (GLITCH) KATMANI (BAŞLANGIÇTA GİZLİ) --- */
        #jumpscare-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Glitchli Korkunç Yüz Tasarımı (SVG Animasyonu) */
        .scary-face-svg {
            width: 80vw;
            height: 80vh;
            max-width: 800px;
            animation: faceGlitch 0.08s infinite alternate, faceShake 0.05s infinite;
            filter: drop-shadow(0 0 30px #ef4444);
        }

        /* Arka Planda Deliren Kırmızı/Siyah Flaş Efekti */
        .strobe-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            animation: strobeAnimation 0.04s infinite;
        }

        /* --- AGRESİF GLITCH VE ANIMASYON TANIMLARI --- */
        @keyframes faceShake {
            0% { transform: translate(4px, -3px) scale(2.2); }
            20% { transform: translate(-5px, 5px) scale(2.3); }
            40% { transform: translate(6px, 3px) scale(2.1); }
            60% { transform: translate(-3px, -6px) scale(2.4); }
            80% { transform: translate(5px, 4px) scale(2.2); }
            100% { transform: translate(-4px, -2px) scale(2.3); }
        }

        @keyframes faceGlitch {
            0%, 100% { filter: hue-rotate(0deg) contrast(2) saturate(2); opacity: 1; }
            50% { filter: hue-rotate(90deg) contrast(5) invert(1); opacity: 0.85; }
        }

        @keyframes strobeAnimation {
            0%, 100% { background-color: #000000; }
            50% { background-color: #3b0712; } /* Koyu kan kırmızısı flaş */
        }
    </style>
</head>
<body>

    <!-- Masum Görünümlü Terminal Arayüzü -->
    <div class="terminal-box" id="startMenu">
        <div class="terminal-header">[!] KRİTİK ÇEKİRDEK HATASI</div>
        <div class="terminal-text">
            XqrStore dosya dizininde bozulma tespit edildi. Ayrıştırılmamış veriler işletim sisteminizin önyükleme (boot) sektörünü tehdit ediyor.<br><br>
            Sistem bütünlüğünü korumak ve güvenli modda yeniden başlatmak için aşağıdaki onarım butonunu tetikleyin.
        </div>
        <button class="action-btn" onclick="tetikleJumpscare()">KODU ONAR VE REBOOT ET</button>
    </div>

    <!-- Jumpscare Katmanı -->
    <div id="jumpscare-container">
        <div class="strobe-bg"></div>
        
        <!-- Saf Kodla Çizilmiş Korkunç Dijital Yüz (SVG) -->
        <svg class="scary-face-svg" viewBox="0 0 200 200" xmlns="http://w3.org">
            <!-- Kafatası İskeleti -->
            <path d="M40,80 Q40,20 100,20 Q160,20 160,80 Q160,130 140,150 L140,170 Q100,180 60,170 L60,150 Q40,130 40,80 Z" fill="#111" stroke="#ef4444" stroke-width="4"/>
            <!-- Korkunç Kanlı Göz Çukurları -->
            <circle cx="70" cy="75" r="22" fill="#000" stroke="#ef4444" stroke-width="2"/>
            <circle cx="130" cy="75" r="22" fill="#000" stroke="#ef4444" stroke-width="2"/>
            <!-- Parlayan Kırmızı Küçük Göz Bebekleri -->
            <circle cx="70" cy="75" r="5" fill="#ff0000">
                <animate attributeName="r" values="3;7;3" dur="0.1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="130" cy="75" r="5" fill="#ff0000">
                <animate attributeName="r" values="3;7;3" dur="0.1s" repeatCount="indefinite"/>
            </circle>
            <!-- Burun Boşluğu -->
            <polygon points="100,95 92,115 108,115" fill="#ef4444"/>
            <!-- Ağız ve Dik dikişli Keskin Dişler -->
            <path d="M 60,140 Q 100,165 140,140" fill="none" stroke="#ef4444" stroke-width="5"/>
            <path d="M 70,135 L 70,150 M 85,138 L 85,155 M 100,140 L 100,158 M 115,138 L 115,155 M 130,135 L 130,150" stroke="#fff" stroke-width="3"/>
        </svg>
    </div>

    <!-- Web Audio API için Glitch Sesi Üreteci (Harici ses dosyası indirmeye gerek bırakmaz) -->
    <script>
        let audioCtx = null;

        // Tarayıcı üzerinden sentetik, aşırı rahatsız edici dijital parazit ve çığlık (Glitch) sesi üreten fonksiyon
        function generateGlitchNoise() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Devasa parazit dalgası oluşturma (Beyaz Gürültü Altyapısı)
            const bufferSize = audioCtx.sampleRate * 2; // 2 Saniyelik ses patlaması
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                // Matematiksel sert dalga kırılmaları (Glitch hissi verir)
                data[i] = Math.random() * 2 - 1;
                if (i % 100 < 30) {
                    data[i] = Math.sin(i * 0.05) * 1.5; // Ani frekans patlamaları ekle
                }
            }

            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            // Alçak ve Yüksek frekans filtreleri ekleyerek sesi kulak tırmalayıcı hale getiriyoruz
            const filter = audioCtx.createBiquadFilter();
            filter.type = "peaking";
            filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
            filter.Q.setValueAtTime(15, audioCtx.currentTime);
            filter.gain.setValueAtTime(25, audioCtx.currentTime);

            // Sesi bağla ve patlat
            noiseNode.connect(filter);
            filter.connect(audioCtx.destination);
            noiseNode.start();
        }

        function tetikleJumpscare() {
            // 1. Ekranı tam ekran moduna zorla
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            else if (doc.mozRequestFullScreen) doc.mozRequestFullScreen();

            // 2. Arayüz geçişini sağla
            setTimeout(() => {
                document.getElementById('startMenu').style.display = 'none';
                document.getElementById('jumpscare-container').style.display = 'flex';
                
                // 3. Glitch ses algoritmasını çalıştır
                generateGlitchNoise();
                
                // Sesi daha da bozmak için yarım saniye arayla ikinci bir parazit dalgası tetikle
                setTimeout(() => { generateGlitchNoise(); }, 300);
            }, 300);
        }
    </script>

</body>
</html>
