<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

function boot(text){

document.getElementById("overlay").style.display="none";

const w=document.getElementById("welcome");

w.innerText=text;

w.style.display="block";

setTimeout(()=>{

w.style.display="none";

},2000);

}

setInterval(()=>{

document.getElementById("clock").innerText=
new Date().toLocaleTimeString();

},1000);

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer=new THREE.WebGLRenderer({
canvas:document.getElementById("globe"),
alpha:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

camera.position.z=4;

const geometry=new THREE.SphereGeometry(1.2,64,64);

const texture=new THREE.TextureLoader().load(
'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
);

const material=new THREE.MeshStandardMaterial({
map:texture
});

const earth=new THREE.Mesh(geometry,material);

scene.add(earth);

const light=new THREE.PointLight(0x00ff88,2);

light.position.set(5,3,5);

scene.add(light);

const ringMaterial=new THREE.MeshBasicMaterial({
color:0x00ff88
});

const ring=new THREE.Mesh(
new THREE.TorusGeometry(1.8,0.02,16,100),
ringMaterial
);

ring.rotation.x=Math.PI/2.3;

scene.add(ring);

function animate(){

requestAnimationFrame(animate);

earth.rotation.y+=0.002;

ring.rotation.z+=0.01;

renderer.render(scene,camera);

}

animate();

</script>

<script>

const network=document.getElementById("network");

const ctx=network.getContext("2d");

network.width=window.innerWidth;

network.height=window.innerHeight;

const nodes=[];

for(let i=0;i<70;i++){

nodes.push({

x:Math.random()*network.width,

y:Math.random()*network.height,

vx:(Math.random()-0.5)*0.7,

vy:(Math.random()-0.5)*0.7

});

}

function drawNetwork(){

ctx.clearRect(0,0,network.width,network.height);

for(let i=0;i<nodes.length;i++){

const a=nodes[i];

a.x+=a.vx;

a.y+=a.vy;

if(a.x<0||a.x>network.width){
a.vx*=-1;
}

if(a.y<0||a.y>network.height){
a.vy*=-1;
}

ctx.beginPath();

ctx.arc(a.x,a.y,2,0,Math.PI*2);

ctx.fillStyle="#00ff88";

ctx.fill();

for(let j=i+1;j<nodes.length;j++){

const b=nodes[j];

const dist=Math.hypot(
a.x-b.x,
a.y-b.y
);

if(dist<130){

ctx.strokeStyle=
"rgba(0,255,100,"+
(1-dist/130)*0.3+
")";

ctx.beginPath();

ctx.moveTo(a.x,a.y);

ctx.lineTo(b.x,b.y);

ctx.stroke();

}

}

}

requestAnimationFrame(drawNetwork);

}

drawNetwork();

</script>
